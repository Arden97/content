---
# IEC 62443-4-2 FR 6: Timely response to events (TRE)
controls:
    - id: CR 6.1
      title: Audit log accessibility
      levels:
          - sl1
      status: pending
      notes: |-
          AU-9(6) inherits audit-rule immutability and audit-tool/configuration
          ownership checks. These assess audit-data and tool protection; the
          ausearch/aureport reader workflow is not selected or exercised.
      rules: []
      controls:
          - nist_800_53:au-9.6

    - id: CR 6.2
      title: Continuous monitoring
      levels:
          - sl2
      status: partial
      notes: |-
          The selected package and systemd-journal-upload service checks support
          an outgoing feed from the profile's journald architecture.
          The selected checks assess journal-upload prerequisites and enablement,
          not collector setup, authenticated delivery, ingestion, or response.
      rules:
          - package_systemd-journal-remote_installed
          # Enable an outgoing feed for the profile's existing journald architecture.
          - service_systemd-journal-upload_enabled
      controls: []
